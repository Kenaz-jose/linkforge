name: Deploy LinkForge

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}

        run: |
          set -e

          echo "Setting up SSH..."

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s' "$VPS_SSH_KEY_B64" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

          echo "Connecting to VPS..."

          ssh -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            "$VPS_USER@$VPS_HOST" << 'EOF'

              set -e

              echo "Entering LinkForge directory..."
              cd /opt/linkforge

              echo "Pulling latest code..."
              git fetch origin main
              git reset --hard origin/main

              echo "Building and starting containers..."
              docker compose up -d --build

              echo "Checking containers..."
              docker compose ps

              echo "Checking application..."

              for i in {1..12}; do
                if curl -fsS https://elinkforge.aarnova.ai/ > /dev/null; then
                  echo "Application is healthy!"
                  break
                fi

                echo "Application not ready yet. Retrying in 5 seconds..."
                sleep 5
              done

              echo "Running final health check..."
              curl -fsS https://elinkforge.aarnova.ai/ > /dev/null

              echo "Deployment successful!"

          EOF
